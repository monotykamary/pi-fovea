name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ast-grep
        run: npm i -g @ast-grep/cli@0.45.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: CLI bundle smoke (the global install artifact)
        run: |
          bun run build:cli
          node dist/cli.mjs status tests/fixtures/mini
