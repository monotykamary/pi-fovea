name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The affected-test selection diffs the push range or the pull-request
          # base, so that base commit has to be present in history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ast-grep
        run: npm i -g @ast-grep/cli@0.45.3
      - run: bun install --frozen-lockfile
      - name: Install Bend 2.0.26 (pinned archive)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/bend.tar.gz" https://github.com/bendlang/bend/releases/download/v2.0.26/bend-2.0.26-linux-x64.tar.gz
          echo "5edcc8e5c12d525655431ab02659ddf88e362aafbe7c7bb7f783a1ffaeb6165c  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
      - name: Laws, executable artifact, and proof bridge boundaries
        run: |
          bun run check:proofs
          bunx vitest run tests/proofs.test.ts tests/verified-kernels.test.ts
      - name: Type check
        run: bun run typecheck
      - name: Affected tests
        env:
          # Pull requests compare against the target branch; pushes compare
          # against the tip they replaced. An unusable base selects nothing.
          PI_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:affected
      - name: Pipeline smoke floor
        # Curated scan-to-render floor (about three seconds) so a push the
        # selection did not cover still exercises the pipeline.
        run: bun run test:smoke
      - name: Dead code
        run: bun run lint:dead
      - name: Isolated published package (CLI, generated kernels, proof receipts)
        run: bun run check:package
